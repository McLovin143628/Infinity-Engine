[package]
name = "inf-viewport"
description = "Native viewport host: per-OS child window embedding, input capture, surface lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
tracing = { workspace = true }
# Camera controller is platform-neutral (headless-testable on any OS).
inf-math = { workspace = true }
glam = { workspace = true }
# The shared scene document (Phase 3): the viewport renders + picks against the
# same SceneDoc the editor edits — the single source of truth. Crosses the
# spawn boundary on every platform, so it's a general (not target) dependency.
inf-editor-core = { workspace = true }
inf-ecs = { workspace = true }
# Wave CHAR1a.3: `DerivedMaterial`, the record a skinned material SECTION draws
# from. Ring 1 -> Ring 0, and no new build cost -- `inf-editor-core` above
# already links it (as does `inf-render`, transitively). Named DIRECTLY rather
# than re-exported for the reason `inf-pcg` below is: the block that reads it is
# character-pinned against the shipped player's copy, and a mirror cannot spell
# one crate two ways.
inf-asset = { workspace = true }
# Terrain heightfield + sculpt brushes (P10.2b): the host raycasts the cursor
# against the shared terrain and applies strokes. Pure Ring-0 (no GPU), so it's
# a general dependency even though only the windowed hosts drive sculpting.
inf-terrain = { workspace = true }
# I8b: the twelve building-module shape families and their content-derived
# GUIDs. Ring 1 -> Ring 0, and no new build cost -- `inf-editor-core` above
# already links it. Named DIRECTLY rather than re-exported through the editor
# core because the block that reads it is character-pinned against the shipped
# player's copy, and a mirror cannot spell one crate two ways.
inf-pcg = { workspace = true }
# P21.1: the sparse SDF chunk volumes that locally extend the heightfield.
inf-voxel = { workspace = true }
# P22.3: `FractureState` — the Simulate session's live destruction state, which
# Ring 2 publishes in so the viewport draws a broken wall's CHUNKS rather than
# the wall. The type comes from the crate that owns the solve, so the render
# projection and the physics swap read one `is_intact`.
inf-physics = { workspace = true }
uuid = { workspace = true }
# Deterministic foliage-scatter RNG (E-P6): the brush seeds an xxh3 hash from
# (seed, stroke index, sample index) so a stroke reproduces identical instances —
# no wall-clock / thread-rng (the determinism law). Same hash the graph/asset
# crates already use.
xxhash-rust = { workspace = true }

[dev-dependencies]
# The terrain-resolution tests build a real streamed terrain from the committed
# sample (write the .inf_terrain into a temp content root, page it in) — the only
# way to assert that a STREAMED terrain's document set is empty while its
# streamer's is not, which is the whole reason every cursor path resolves through
# `terrain_probe`.
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
inf-render = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
inf-render = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-quartz-core = { workspace = true }
objc2-core-foundation = { workspace = true }
