# The same UTM zone and the same ground as the full island, offset to sit over
# the corner with the most relief per square kilometre — a fixture on flat ground
# would certify the hydrology against a puddle.
#
# The degrees are stated rather than inverted; see the full island's recipe for
# the byte that bought that rule. This fixture CARRIED the same hazard and was
# never seen to fail — the samples arm compares the full island first and stops
# there, so on the red run the fixture's own bytes were never reached. "It
# passed" would have been a reading of an assertion that did not run.
[anchor]
crs = "EPSG:32610"
easting_m = 492600.0
northing_m = 5467400.0
height_m = 0.0
latitude_deg = 49.359266718
longitude_deg = -123.101907316
convergence_deg = 0.077333377
vertical_datum = "EGM2008"

# 6 x 6 level-0 tiles of 129 samples at 2 m = 1 536 m square = 2.36 km2.
[grid]
tile_resolution = 129
meters_per_sample = 2.0
tiles = 6

# z13 and NO margin: the margin exists so a bilinear read at the world's border
# has a neighbour, and at this scale the extent sits four tiles' worth of ground
# inside the ones it names anyway. Dropping it is what keeps the committed bytes
# to four tiles instead of sixteen.
[source]
kind = "terrarium"
zoom = 13
url = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"
cache = "tiles"
tile_margin = 0

[sea]
level_m = 120.0
shelf_depth_m = 40.0
shelf_width_m = 200.0
beach_width_m = 24.0
beach_rise_m = 6.0

[roads]
layer = "layers/roads.geojson"
max_grade = 0.10
grade_step_m = 12.0
# Wave ROAD1b: one lane of batter outside the plateau. It was 1.6 -- 11.2 m --
# which with the plateau made a 41.4 m levelled scar around a road 19 m wide at
# its widest, and the ROAD1 audit's carried 23 is that it reads as one in every
# PIE frame. 26.0 m now: the road's own width and a stated shoulder.
shoulder_mult = 0.5

[hydro]
stream_catchment_m2 = 30000.0
lake_depth_m = 1.0
lake_area_m2 = 500.0
waterfall_grade = 0.12
vertex_stride = 2

[biomes]
masks = "layers/biomes.geojson"
alpine_m = 560.0
rock_deg = 34.0
beach_m = 12.0
classes = 3
class_biomes = ["plain", "forest", "meadow"]

# THE FIXTURE'S SITES ARE SETTLEMENTS NOW (wave I8a, clause 2), and the camp
# grew to fit one.
#
# `Fixture Camp` was 90 m: a 76 m town grid's first block reaches 96.2 m from the
# centre, so a 90 m reservation held ZERO blocks and CI's only town would have
# built nothing. 130 m holds the first ring.
#
# **`Fixture Town` did NOT grow, and the reason is a measurement.** This fixture
# is a mountain — 254.7 m of relief over 1.5 km of land — and a site pad's rim is
# steeper than the hillside it is cut into by construction: `flatten_sample`
# eases with `smooth01`, whose derivative peaks at 1.5, so the rim's gradient is
# about 1.25x the local slope whatever the radius. Widening this pad walks that
# rim onto the road. Measured on this fixture, worst grade against a 0.100
# ceiling: **120 m -> 0.099 and zero stretches over; 240 m -> 0.110 and one;
# 280 m -> 0.118 and four; 340 m -> 0.125 and five, which is 3.47 % of 144
# measured stretches and BLOCKING past `ROAD_OVER_GRADE_CEILING`.** Re-planning
# the network first (`inf island route`) took 3.47 % to 3.08 % and no further.
# And a second cost with a different shape: past 140 m the pad fills this
# island's one lake, and the derived lake layer goes from one to none.
#
# So the town keeps its radius and the GENERATOR adapts instead: a settlement
# takes the coarsest grid of its kind's ladder that fits its own reservation, and
# a 120 m city reservation takes the town's 76 m grid rather than the city's
# 120 m one. See `inf_editor_core::settlement::grid_for`.
#
# AND THIS FIXTURE'S WATER LAYERS ARE NOT RE-DERIVED, which is a REFUSAL with a
# measurement rather than an oversight. The full island's were (its committed
# drift is 0.00 % now, and its worst road grade IMPROVED, 0.118 -> 0.108). Here a
# fresh derivation finds 9 reaches of 1.33 km where the committed layer has 9 of
# 1.25 km, and one of the new channels crosses a route: the road audit goes from
# **worst 0.099 and zero stretches over** to **worst 0.239 and five**, because
# `carve_channels` cuts a trench and this generator builds no bridges (the I7
# refusal). The committed layers stay, the drift stays at 5.43 % of stream length
# with the lake exact, and the day a bridge exists this is the paragraph to
# delete.

[[sites]]
name = "Fixture Town"
kind = "city"
x = -420.0
z = 380.0
radius_m = 120.0

[[sites]]
name = "Fixture Camp"
kind = "town"
x = 430.0
z = -300.0
radius_m = 130.0
