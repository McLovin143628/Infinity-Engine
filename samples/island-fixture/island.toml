# The CI-scale island — a corner of the real one, and the only island CI builds.
#
# It exercises EVERY step of the recipe against **committed** elevation bytes:
# `[source] cache` points at `tiles/` beside this file, and the gate asserts the
# plan's tile list is exactly what is committed there, so a build that needed one
# more tile would go red rather than reach for a network.
#
#     cargo test -p inf-island --test island_fixture
#
# Provenance of the committed bytes: AWS terrain-tiles
# (`s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png`), zoom 13,
# fetched 2026-08-21. They are the same public, keyless, no-attribution-required
# terrarium tiles the full recipe reads; nothing about them is synthetic, which
# is the point — a fixture with a made-up DEM would certify a decoder against
# itself.

schema_version = 2
name = "Island Fixture"
seed = 7

coast = "layers/coast.geojson"
streams = "layers/streams.geojson"
lakes = "layers/lakes.geojson"

# The committed halves a build copies into the project's Content. Must stay above
# the first `[table]` header — see the full island's recipe for what happens when
# it does not.
content = [
  "IslandFixture.inf_lvl",
  "IslandFixture.inf_lvl.toml",
  "IslandFixtureCover.inf_pcg",
  "IslandFixtureCover.inf_pcg.toml",
  # The STARTER CHARACTER (SK1c) -- the island's hero IS it, so the level's
  # `SkeletalMesh`, `AnimStateMachine` and `ActorClass` name these GUIDs and a
  # project built without them boots a hero with no rig. They live with the
  # ENGINE (`samples/starter-character/`) rather than in this folder: one copy,
  # generated by the New Character wizard's own door and byte-locked against
  # it, referenced by both islands and scaffolded into every 3D project.
  # `[content]` resolves against this recipe's own directory and copies by
  # BASENAME, so `../starter-character/X` lands at `Content/X`.
  "../starter-character/Starter.inf_skel",
  "../starter-character/Starter.inf_skel.toml",
  "../starter-character/Starter_Body.inf_mesh",
  "../starter-character/Starter_Body.inf_mesh.toml",
  "../starter-character/Starter_Skin.inf_mat",
  "../starter-character/Starter_Skin.inf_mat.toml",
  "../starter-character/Starter_Idle.inf_anim",
  "../starter-character/Starter_Idle.inf_anim.toml",
  "../starter-character/Starter_Walk.inf_anim",
  "../starter-character/Starter_Walk.inf_anim.toml",
  # The SECOND committed body (wave CHAR1a.2): the same rig contract,
  # proportions measured off SKM_Quinn. The crowd wears whichever rigged
  # bodies the level offers, so a project that has both can dress a street
  # in both -- and a project that copies only one cannot.
  "../starter-character-f/Starter_F.inf_skel",
  "../starter-character-f/Starter_F.inf_skel.toml",
  "../starter-character-f/Starter_F_Body.inf_mesh",
  "../starter-character-f/Starter_F_Body.inf_mesh.toml",
  "../starter-character-f/Starter_F_Controller.inf_act",
  "../starter-character-f/Starter_F_Controller.inf_act.toml",
  "../starter-character-f/Starter_F_Idle.inf_anim",
  "../starter-character-f/Starter_F_Idle.inf_anim.toml",
  "../starter-character-f/Starter_F_Locomotion.inf_sm",
  "../starter-character-f/Starter_F_Locomotion.inf_sm.toml",
  "../starter-character-f/Starter_F_Locomotion.inf_sm.txt",
  "../starter-character-f/Starter_F_Run.inf_anim",
  "../starter-character-f/Starter_F_Run.inf_anim.toml",
  "../starter-character-f/Starter_F_Skin.inf_mat",
  "../starter-character-f/Starter_F_Skin.inf_mat.toml",
  "../starter-character-f/Starter_F_Walk.inf_anim",
  "../starter-character-f/Starter_F_Walk.inf_anim.toml",
  "../starter-character/Starter_Run.inf_anim",
  "../starter-character/Starter_Run.inf_anim.toml",
  "../starter-character/Starter_Locomotion.inf_sm",
  "../starter-character/Starter_Locomotion.inf_sm.toml",
  "../starter-character/Starter_Locomotion.inf_sm.txt",
  "../starter-character/Starter_Controller.inf_act",
  "../starter-character/Starter_Controller.inf_act.toml",

  # THE GROUND LIBRARY (TER2a). The island's four TerrainLayers name four of
  # these five `.inf_mat` GUIDs, so a project built without them has ground
  # bound to materials nothing can resolve and shades off the scalar
  # fallback for ever. They live with the ENGINE (`samples/ground/`) rather
  # than in this folder for the starter character's reason: one copy,
  # byte-locked against its generator, referenced by both islands.
  "../ground/Cover_GrassTuft.inf_mesh",
  "../ground/Cover_GrassTuft.inf_mesh.toml",
  "../ground/Cover_Rock.inf_mesh",
  "../ground/Cover_Rock.inf_mesh.toml",
  "../ground/Cover_Shrub.inf_mesh",
  "../ground/Cover_Shrub.inf_mesh.toml",
  "../ground/Ground_ForestFloor.inf_mat",
  "../ground/Ground_ForestFloor.inf_mat.toml",
  "../ground/Ground_ForestFloor_Albedo.inf_tex",
  "../ground/Ground_ForestFloor_Albedo.inf_tex.toml",
  "../ground/Ground_ForestFloor_Normal.inf_tex",
  "../ground/Ground_ForestFloor_Normal.inf_tex.toml",
  "../ground/Ground_ForestFloor_ORM.inf_tex",
  "../ground/Ground_ForestFloor_ORM.inf_tex.toml",
  "../ground/Ground_Grass.inf_mat",
  "../ground/Ground_Grass.inf_mat.toml",
  "../ground/Ground_Grass_Albedo.inf_tex",
  "../ground/Ground_Grass_Albedo.inf_tex.toml",
  "../ground/Ground_Grass_Detail.inf_tex",
  "../ground/Ground_Grass_Detail.inf_tex.toml",
  "../ground/Ground_Grass_Normal.inf_tex",
  "../ground/Ground_Grass_Normal.inf_tex.toml",
  "../ground/Ground_Grass_ORM.inf_tex",
  "../ground/Ground_Grass_ORM.inf_tex.toml",
  "../ground/Ground_Rock.inf_mat",
  "../ground/Ground_Rock.inf_mat.toml",
  "../ground/Ground_Rock_Albedo.inf_tex",
  "../ground/Ground_Rock_Albedo.inf_tex.toml",
  "../ground/Ground_Rock_Detail.inf_tex",
  "../ground/Ground_Rock_Detail.inf_tex.toml",
  "../ground/Ground_Rock_Normal.inf_tex",
  "../ground/Ground_Rock_Normal.inf_tex.toml",
  "../ground/Ground_Rock_ORM.inf_tex",
  "../ground/Ground_Rock_ORM.inf_tex.toml",
  "../ground/Ground_Sand.inf_mat",
  "../ground/Ground_Sand.inf_mat.toml",
  "../ground/Ground_Sand_Albedo.inf_tex",
  "../ground/Ground_Sand_Albedo.inf_tex.toml",
