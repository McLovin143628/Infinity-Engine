  "../ground/Ground_Soil_ORM.inf_tex",
  "../ground/Ground_Soil_ORM.inf_tex.toml",

  # THE ROAD SURFACE (wave ASSET0, clause 0). The level binds this
  # `.inf_mat` on its `Roads` entity, so a project built without it has the
  # street the hero stands on bound to a material nothing can resolve --
  # which is exactly the 0.8 debug grey this wave went to remove.
  "../ground/Road_Asphalt.inf_mat",
