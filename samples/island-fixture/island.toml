  "../settlement/Venue_Music.inf_audio.toml",
  "../settlement/Zone_Estate.inf_pcg",
  "../settlement/Zone_Estate.inf_pcg.toml",
  "../settlement/Zone_Hotel.inf_pcg",
  "../settlement/Zone_Hotel.inf_pcg.toml",
  "../settlement/Zone_House.inf_pcg",
  "../settlement/Zone_House.inf_pcg.toml",
  "../settlement/Zone_Industrial.inf_pcg",
  "../settlement/Zone_Industrial.inf_pcg.toml",
  "../settlement/Zone_Nightclub.inf_pcg",
  "../settlement/Zone_Nightclub.inf_pcg.toml",
  "../settlement/Zone_Office.inf_pcg",
  "../settlement/Zone_Office.inf_pcg.toml",
  "../settlement/Zone_Shop.inf_pcg",
  "../settlement/Zone_Shop.inf_pcg.toml",
  "../settlement/Zone_StripClub.inf_pcg",
  "../settlement/Zone_StripClub.inf_pcg.toml",
  "../settlement/Zone_Clinic.inf_pcg",
  "../settlement/Zone_Clinic.inf_pcg.toml",
  "../settlement/Zone_FireHall.inf_pcg",
  "../settlement/Zone_FireHall.inf_pcg.toml",
