# The Vancouver island — the recipe (wave I7).
#
# This file, the layers beside it and the level are what the repository commits.
# The terrain, the road mesh and the biome set are gigabytes and are NOT:
#
#     inf island build --recipe samples/island/island.toml
#
# fetches the elevation this recipe names, samples it, carves the coastline,
# derives the water and the biomes, drapes and audits the roads, and writes the
# heavy halves into a project outside the tree.
#
# THE ELEVATION IS REAL. The source is the AWS terrain-tiles terrarium pyramid —
# a keyless, worldwide DEM — over the North Shore mountains behind Vancouver.
# What is designed is the SHAPE: the coastline that makes this a landmass, the
# settlement sites, and the road network routed between them under a grade
# ceiling.

schema_version = 2
name = "Vancouver Island"

# Every stochastic step salts this through a name of its own; see
# `IslandRecipe::seed_for`.
seed = 20260821

# The committed design and derived layers, relative to this file.
coast = "layers/coast.geojson"
streams = "layers/streams.geojson"
lakes = "layers/lakes.geojson"

# The committed halves a build copies into the project's Content, so ONE command
# produces something that cooks. The level and the `.inf_pcg` its biome set binds
# are written by the Ring-1 generator
# (`INF_BLESS_SAMPLES=1 cargo test -p inf-editor-core samples`) from the design in
# this folder — no elevation is read to author them.
#
# **This key must stay above the first `[table]` header.** In TOML a bare key
# after one belongs to it, so `content` written below `[source]` becomes
# `source.content` — a key nothing reads, silently. It did, and the copy step
# quietly did nothing until `deny_unknown_fields` made it say so.
content = [
  "VancouverIsland.inf_lvl",
  "VancouverIsland.inf_lvl.toml",
  "VancouverIslandCover.inf_pcg",
  "VancouverIslandCover.inf_pcg.toml",
  # The STARTER CHARACTER (SK1c) -- the island's hero IS it, so the level's
  # `SkeletalMesh`, `AnimStateMachine` and `ActorClass` name these GUIDs and a
  # project built without them boots a hero with no rig. They live with the
  # ENGINE (`samples/starter-character/`) rather than in this folder: one copy,
  # generated by the New Character wizard's own door and byte-locked against
  # it, referenced by both islands and scaffolded into every 3D project.
  # `[content]` resolves against this recipe's own directory and copies by
  # BASENAME, so `../starter-character/X` lands at `Content/X`.
  "../starter-character/Starter.inf_skel",
  "../starter-character/Starter.inf_skel.toml",
  "../starter-character/Starter_Body.inf_mesh",
  "../starter-character/Starter_Body.inf_mesh.toml",
  "../starter-character/Starter_Skin.inf_mat",
  "../starter-character/Starter_Skin.inf_mat.toml",
  "../starter-character/Starter_Idle.inf_anim",
  "../starter-character/Starter_Idle.inf_anim.toml",
  "../starter-character/Starter_Walk.inf_anim",
  "../starter-character/Starter_Walk.inf_anim.toml",
  # The SECOND committed body (wave CHAR1a.2): the same rig contract,
  # proportions measured off SKM_Quinn. The crowd wears whichever rigged
  # bodies the level offers, so a project that has both can dress a street
  # in both -- and a project that copies only one cannot.
  "../starter-character-f/Starter_F.inf_skel",
  "../starter-character-f/Starter_F.inf_skel.toml",
  "../starter-character-f/Starter_F_Body.inf_mesh",
  "../starter-character-f/Starter_F_Body.inf_mesh.toml",
  "../starter-character-f/Starter_F_Controller.inf_act",
  "../starter-character-f/Starter_F_Controller.inf_act.toml",
